name: "SENTINEL APEX SOC — Owner Read-Only Release Evidence"

# Manual inspection ONLY. This workflow has no push, schedule or deploy path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soc-owner-read-only-release-evidence
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    name: "Inspect private Cloudflare prerequisites; NEVER deploy"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: "Checkout current main without persisted credentials"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Node.js 22 for built-in read-only checkers"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      # Source integrity is a PREDEPLOY prerequisite. It must not depend
      # on whether the old production Worker currently serves October data.
      # Local source checks perform zero Cloudflare, Blogger or payment I/O.
      - name: "P0 source publication-ledger and RSS chronology (local read-only)"
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-publication-ledger.cjs
          node scripts/verify-soc-rss-source-truth.cjs

      - name: "P0 private account-wide zero-overage attestation"
        id: budget
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CDB_CF_ACCOUNT_BUDGET_ATTESTATION: ${{ secrets.CDB_CF_ACCOUNT_BUDGET_ATTESTATION }}
        run: node scripts/cloudflare-account-zero-overage-gate.cjs

      - name: "P0 both existing Worker Custom Domains (read-only GET)"
        id: domains
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-existing-cloudflare-domain.cjs

      - name: "P0 live Worker deployment and version identity (read-only GET)"
        id: version
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/soc-cloudflare-owner-inventory.cjs

      - name: "P0 root feed source versus two public hostnames (GET only)"
        id: root
        continue-on-error: true
        run: node scripts/certify-soc-public-feed-parity.cjs

      - name: "P0 S2N source versus two public hostnames (GET only)"
        id: s2n
        continue-on-error: true
        run: node scripts/certify-soc-s2n-api-release.cjs --monitor-public

      - name: "P0 two-phase release-evidence verdict — never deployment authorization"
        id: gate
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          DOMAINS_OUTCOME: ${{ steps.domains.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          ROOT_OUTCOME: ${{ steps.root.outcome }}
          S2N_OUTCOME: ${{ steps.s2n.outcome }}
        run: |
          set -euo pipefail
          # A stale PUBLIC edge is expected BEFORE a protected deploy, but
          # it must never be counted as a passing customer-release check.
          # Independent PREDEPLOY prerequisites remain visible to the owner.
          prereq=HOLD
          delivery=HOLD
          if [ "${SOURCE_OUTCOME:-}" = success ] && [ "${BUDGET_OUTCOME:-}" = success ] &&
             [ "${DOMAINS_OUTCOME:-}" = success ] && [ "${VERSION_OUTCOME:-}" = success ]; then
            prereq=PASS_NOT_DEPLOY_AUTHORIZATION
          fi
          if [ "${ROOT_OUTCOME:-}" = success ] && [ "${S2N_OUTCOME:-}" = success ]; then
            delivery=PASS_NOT_CUSTOMER_GA
          fi
          {
            echo '### SOC OWNER READ-ONLY RELEASE EVIDENCE — TWO SEPARATE STAGES'
            echo '| Stage / evidence | Observed result |'
            echo '|---|---|'
            echo "| Predeploy: locally verified report ledger and RSS | ${SOURCE_OUTCOME:-unavailable} |"
            echo "| Predeploy: account-wide zero-overage attestation | ${BUDGET_OUTCOME:-unavailable} |"
            echo "| Predeploy: both established Worker Custom Domains | ${DOMAINS_OUTCOME:-unavailable} |"
            echo "| Predeploy: current Worker version (rollback NOT tested) | ${VERSION_OUTCOME:-unavailable} |"
            echo "| **Independent predeployment prerequisite verdict** | **${prereq}** |"
            echo "| Postdeploy/current-edge: SOC/blog root feed parity | ${ROOT_OUTCOME:-unavailable} |"
            echo "| Postdeploy/current-edge: SOC/blog S2N feed parity | ${S2N_OUTCOME:-unavailable} |"
            echo "| **Current public-delivery verdict** | **${delivery}** |"
            echo
            echo 'This audit performs NO Worker deployment, DNS change, Blogger publication, paid checkout or customer mutation.'
            echo 'A predeployment PASS never authorizes or proves a deployed release.'
            echo 'A public-delivery HOLD is NOT waived by passing finance, domain or source checks.'
            echo 'Still required: owner-approved exact current SHA, full drift review, rollback version and plan, protected manual deployment, source-post byte parity, customer and payment acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$prereq" != PASS_NOT_DEPLOY_AUTHORIZATION ]; then
            echo 'HOLD: SOC_PREDEPLOY_PREREQUISITES_NOT_CERTIFIED — no deploy authorization'
            exit 2
          fi
          if [ "$delivery" != PASS_NOT_CUSTOMER_GA ]; then
            echo 'PASS: SOC_PREDEPLOY_EVIDENCE_COMPLETE_NOT_DEPLOY_AUTHORIZATION'
            echo 'HOLD: SOC_READ_ONLY_EVIDENCE_INCOMPLETE — current public edge is not certified'
            exit 2
          fi
          echo 'PASS: SOC_READ_ONLY_EVIDENCE_COMPLETE_NOT_DEPLOY_AUTHORIZATION'
