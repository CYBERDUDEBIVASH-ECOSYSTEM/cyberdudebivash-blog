name: "Blogger Legacy Quality Audit"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only audit or quarantine objective integrity failures"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - quarantine
      max_posts:
        description: "Most recent posts to inspect (1-500)"
        required: true
        default: '50'

permissions:
  contents: read

concurrency:
  group: blogger-legacy-quality
  cancel-in-progress: false

jobs:
  audit:
    name: "Audit legacy report quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: "Install dependencies"
        run: pip install -r requirements.txt

      - name: "Audit or quarantine"
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # Dispatch inputs reach the shell ONLY as environment values, never as ${{ }} text inside the
          # script. max_posts is free text: interpolating it into this step (which holds the Blogger OAuth
          # secret and refresh token) would let anyone who can dispatch run arbitrary commands without a
          # reviewed change. Pinned by tests-js/workflow-dispatch-input-injection.test.js.
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX_POSTS: ${{ inputs.max_posts }}
        run: |
          set -euo pipefail
          case "$INPUT_MODE" in
            dry-run|quarantine) ;;
            *) echo "::error::mode must be dry-run or quarantine"; exit 1 ;;
          esac
          [[ "$INPUT_MAX_POSTS" =~ ^[0-9]{1,3}$ ]] || { echo "::error::max_posts must be a whole number from 1 to 500"; exit 1; }
          [ "$INPUT_MAX_POSTS" -ge 1 ] && [ "$INPUT_MAX_POSTS" -le 500 ] || { echo "::error::max_posts must be a whole number from 1 to 500"; exit 1; }
          APPLY_FLAG=""
          if [ "$INPUT_MODE" = "quarantine" ]; then
            APPLY_FLAG="--apply"
          fi
          python -m automation.legacy_quality_auditor \
            --max-posts "$INPUT_MAX_POSTS" \
            --manifest logs/legacy-quality-manifest.json \
            $APPLY_FLAG

      - name: "Upload quality manifest and recovery backup"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-quality-${{ inputs.mode }}-${{ github.run_id }}
          path: logs/legacy-quality-manifest.json
          if-no-files-found: error
          retention-days: 7
