name: "🧭 SENTINEL APEX — Production Drift Reconciler"

on:
  workflow_run:
    workflows:
      - "⚡ SENTINEL APEX v5.0 — High-Frequency Global Intel Pipeline"
      - "🧠 SENTINEL APEX — AI Security Intelligence Pipeline"
      - "🛰 SENTINEL APEX — Auto CVE Page Generator"
      - "🛰 SENTINEL APEX — Auto RSS Generator"
      - "🛰 SENTINEL APEX — Intelligence Hub Generator"
      - "⚡ CYBERDUDEBIVASH® — Blogger Syndication Engine"
    types: [completed]
    branches: [main]
  schedule:
    # Low-cost independent backstop once daily, outside top-of-hour load.
    # The six workflow_run triggers above still check every producer completion,
    # including failures/cancellations, immediately and without deploying.
    # Manual production releases remain separately certified and approved.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-drift-reconciler
  cancel-in-progress: true

jobs:
  reconcile:
    name: "Read-only drift assessment — operator-approved releases only"
    # Skipped publisher jobs do not create production data drift; preserve
    # immediate inventory for producer success, failure and cancellation.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped' }}
    # A producer may commit verified source data and then FAIL a post-push
    # source-yield or publication-quality gate. Still perform drift inventory
    # for completed success/failure/cancelled producer runs. Monitoring is
    # read-only and MUST NOT retry a failed publisher or deploy a Worker.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Read source-of-truth release policy"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - name: "Compare fully certified deploy with main (no mutation)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-drift-policy.cjs
