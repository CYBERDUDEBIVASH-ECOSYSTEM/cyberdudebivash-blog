name: "🛰 SENTINEL APEX — SOC RSS Source Truth (Read Only)"

# The high-frequency SENTINEL APEX publisher is the sole source RSS writer.
# This previously scheduled writer rebuilt rss.xml from date-only HTML and
# pushed to main, competing with fresh intel publication. Keep the filename
# for existing workflow references, but remove all mutation and cron.
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'rss.xml'
      - 'fetch-live-intel.js'
      - 'generate-rss.js'
      - 'scripts/verify-soc-rss-source-truth.cjs'
      - '.github/workflows/generate-rss.yml'
  pull_request:
    paths:
      - 'posts/**'
      - 'rss.xml'
      - 'fetch-live-intel.js'
      - 'generate-rss.js'
      - 'scripts/verify-soc-rss-source-truth.cjs'
      - '.github/workflows/generate-rss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soc-rss-source-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-rss:
    name: "Verify existing RSS canonical sources, chronology and bounds"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout (no persisted write token)"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup locked runtime"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: "Read-only source RSS verification"
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-soc-rss-source-truth.cjs
          node scripts/verify-soc-rss-source-truth.cjs

      - name: "RSS chronology and single-writer regression tests"
        shell: bash
        run: |
          set -euo pipefail
          node --test tests-js/rss-date-integrity.test.js tests-js/soc-rss-source-truth.test.js

      - name: "Verify read-only workflow did not change source artifacts"
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- rss.xml
          git diff --exit-code -- posts
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "RSS_VALIDATION_PASS_READ_ONLY_NOT_EDGE_DELIVERY"
