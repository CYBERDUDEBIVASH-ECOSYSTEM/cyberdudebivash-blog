name: SENTINEL APEX presentation branding
on:
  pull_request:
    paths:
      - 'scripts/sentinel-branding.cjs'
      - 'scripts/sentinel-branding.test.cjs'
      - 'scripts/build-cloudflare-assets.js'
      - '.github/workflows/sentinel-branding-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentinel-branding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: node --test scripts/sentinel-branding.test.cjs

