name: "📡 SENTINEL APEX — SOC Runtime Feed Publisher (Option A)"

# Option A durable freshness (docs/operations/SOC-RUNTIME-FEED-OPTION-A.md).
# Copies the public feeds and recently added dossiers from main to a DEDICATED
# R2 bucket that the Worker serves live, so freshness no longer depends on a
# deploy.
#
# SAFETY PROPERTIES (pinned by tests-js/runtime-feed-publisher-workflow.test.js):
#  - SKIPPED unless vars.SOC_RUNTIME_FEED_ENABLED == 'true' (default: off).
#  - READ-ONLY toward git: permissions contents:read, no commit/push, so it can
#    never move main and can never invalidate a SHA-pinned release.
#  - NEVER holds the Cloudflare deploy token. Only a bucket-scoped R2 token.
#  - main only; cannot run on a feature ref with production secrets.
#  - Hard write caps live in the script (per run and per UTC day).
on:
  push:
    branches: [main]
    paths:
      - "live-intel.json"
      - "api/intel/live.json"
      - "rss.xml"
      - "posts/**"
  # Safety net: catches a missed push event and re-uploads anything absent.
  schedule:
    - cron: "21,51 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only: validate and list what would be uploaded (no writes)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      since_commits:
        description: "How many recent commits to scan for new dossiers (1-300)"
        required: false
        default: "12"
        type: string
      check_only:
        description: "Only verify the R2 credentials and bucket (one signed read-only request)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# One publisher at a time; never cancel an upload in flight. The script is
# monotonic (never overwrites a feed with an older one), so ordering is safe.
concurrency:
  group: soc-runtime-feed-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: "Publish runtime feed to R2"
    # Master switch (default off) and main-only: production-adjacent secrets
    # must never be exposed to a feature ref.
    if: ${{ github.ref == 'refs/heads/main' && vars.SOC_RUNTIME_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout main (bounded history for dossier discovery)"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 320
          persist-credentials: false

      - name: "Setup Node.js"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: "Validate manual inputs (never interpolated into shell)"
        env:
          INPUT_SINCE_COMMITS: ${{ github.event.inputs.since_commits || '12' }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SINCE_COMMITS" =~ ^[0-9]{1,3}$ ]] || { echo "::error::since_commits must be 1-300"; exit 1; }
          [ "$INPUT_SINCE_COMMITS" -ge 1 ] && [ "$INPUT_SINCE_COMMITS" -le 300 ] || { echo "::error::since_commits must be 1-300"; exit 1; }

      - name: "Verify R2 credentials and bucket (read-only)"
        if: ${{ github.event.inputs.check_only == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.SOC_RUNTIME_FEED_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SOC_RUNTIME_FEED_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.SOC_RUNTIME_FEED_BUCKET }}
        run: node scripts/publish-runtime-feed.cjs --check

      - name: "Publish feeds and new dossiers (capped, deduplicated, monotonic)"
        if: ${{ github.event.inputs.check_only != 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.SOC_RUNTIME_FEED_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SOC_RUNTIME_FEED_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.SOC_RUNTIME_FEED_BUCKET }}
          INPUT_SINCE_COMMITS: ${{ github.event.inputs.since_commits || '12' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then extra+=(--dry-run); fi
          node scripts/publish-runtime-feed.cjs --since-commits "$INPUT_SINCE_COMMITS" --max-puts 400 --daily-cap 3000 "${extra[@]}"
