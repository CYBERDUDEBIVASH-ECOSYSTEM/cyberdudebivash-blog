name: "🔒 SENTINEL APEX — Security Audit & Dependency Check"

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'api/**'
      - 'workers/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'vercel.json'
      - '.vercelignore'
      - 'vercel-ignore-build.sh'
      - 'automation/**'
      - 'lib/**'
      - 'scripts/**'
      - 'Sentinel-APEX/**'
      - 'fetch-live-intel.js'
      - 'generate-rss.js'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'api/**'
      - 'workers/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'vercel.json'
      - '.vercelignore'
      - 'vercel-ignore-build.sh'
      - 'automation/**'
      - 'lib/**'
      - 'scripts/**'
      - 'Sentinel-APEX/**'
      - 'fetch-live-intel.js'
      - 'generate-rss.js'
      - '.github/workflows/**'
  schedule:
    - cron: '39 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: "npm audit + Security Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'

      - name: "P0 verify dependency release-policy parity"
        run: node --test tests-js/customer-release-runtime-audit-gate.test.js

      - name: "🔒 npm audit — production moderate-or-higher vulnerabilities"
        run: |
          set -euo pipefail
          if [ ! -f package.json ] || [ ! -f package-lock.json ]; then
            echo "::error title=Dependency audit blocked::Production npm manifest or lockfile missing"
            exit 1
          fi
          npm ci --ignore-scripts --no-fund --legacy-peer-deps
          npm audit --omit=dev --audit-level=moderate

      - name: "🔍 Production Secret Exposure Gate"
        shell: bash
        run: |
          set -euo pipefail
          # Synthetic credential-shaped fixtures are intentionally allowed only
          # inside test trees. Production/runtime/workflow/source surfaces remain
          # fail-closed. This prevents the exact false positive found on PR #178
          # without teaching the gate to ignore any real production credential.
          PATTERNS=(
            'sk_live_[A-Za-z0-9]+'
            'AKIA[A-Z0-9]{16}'
            'ghp_[A-Za-z0-9]{36}'
            # Real fine-grained PATs have a substantial opaque suffix. Short
            # percent-delimited example placeholders in external CTI research
            # are not credentials. Continue detecting long GitHub PAT values.
            'github_pat_[A-Za-z0-9_]{20,}'
            'xox[baprs]-[A-Za-z0-9-]+'
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            while IFS= read -r match; do
              [ -z "$match" ] && continue
              echo "::error title=Potential Secret Exposure::Tracked production content matched a credential/private-key signature."
              # Never echo matched source. Partial regex redaction can leak
              # credentials or private CTI text from exceptionally long report lines.
              file_path="${match%%:*}"
              remainder="${match#*:}"
              line_number="${remainder%%:*}"
              case "$line_number" in ''|*[!0-9]*) line_number='?' ;; esac
              printf 'SENSITIVE_MATCH path=%s line=%s signature=%s (content withheld)\n' "$file_path" "$line_number" "$pattern"
              FOUND=1
            done < <(
              git grep -nE "$pattern" -- \
                ':!*.md' \
                ':!docs/**' \
                ':!.env.example' \
                ':!tests/**' \
                ':!tests-js/**' \
                ':!automation/tests/**' \
                ':!**/*.test.js' \
                ':!**/*.test.ts' \
                ':!**/*.spec.js' \
                ':!**/*.spec.ts' \
                2>/dev/null || true
            )
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Production secret exposure gate FAILED"
            exit 1
          fi
          echo "No credential/private-key signatures detected in tracked production content"

      - name: "Cloudflare runtime and security headers"
        run: |
          node scripts/check-cloudflare-runtime.js
          node --test workers/lib/security-headers.test.js scripts/check-cloudflare-runtime.test.js scripts/build-cloudflare-assets.test.js workers/lib/route-table.test.js workers/lib/router.test.js

      - name: "📋 Audit Summary"
        if: always()
        run: |
          echo "SENTINEL APEX security audit completed"
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Trigger: ${{ github.event_name }}"

